plugins {
    id 'com.android.application'
    id 'androidx.navigation.safeargs'
    id 'com.google.gms.google-services'
}

android {
    namespace 'sss.yml.smi'
    defaultConfig {
        compileSdk 34
        applicationId "sss.yml.smi"
        minSdkVersion 19
        targetSdkVersion 34
        multiDexEnabled true
        versionCode 4254 //new version release 2023-02-09
        versionName "4.2.5.4"
        resConfigs "en", "si", "ta"
        vectorDrawables {
            useSupportLibrary = true
        }
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }
    signingConfigs {
        release {
            storeFile file('.\\SSSCert.jks')
            storePassword '773661227'
            keyAlias = 'sssKey'
            keyPassword '50864636'
        }
        debug {
            storeFile file('.\\SSSCert.jks')
            storePassword '773661227'
            keyAlias = 'sssKey'
            keyPassword '50864636'
        }
    }
    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            //shrinkResources true
            //minifyEnabled true
            signingConfig signingConfigs.debug
        }
    }
    bundle {
        language {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    compileSdk 34
    buildToolsVersion '34.0.0'
}
dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation platform('com.google.firebase:firebase-bom:30.2.0')

    implementation 'com.firebaseui:firebase-ui-auth:8.0.1'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.google.firebase:firebase-ads:21.5.0'
    implementation 'com.google.android.gms:play-services-ads:21.5.0'

    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.annotation:annotation:1.7.1'
    implementation 'androidx.navigation:navigation-fragment:2.7.7'
    implementation 'androidx.navigation:navigation-ui:2.7.7'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation "androidx.room:room-runtime:2.6.1"
    annotationProcessor "androidx.room:room-compiler:2.6.1"
    implementation project(':MPChartLib')
}