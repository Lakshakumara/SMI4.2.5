plugins {
    id 'com.android.application'
    id 'androidx.navigation.safeargs'
    id 'com.google.gms.google-services'
}

android {
    namespace 'sss.yml.smi'
    defaultConfig {
        compileSdk 36
        applicationId "sss.yml.smi"
        minSdkVersion 23
        targetSdkVersion 36
        multiDexEnabled true
        versionCode 4265 //new version release 2023-02-09
        versionName "4.2.6.5"
        resourceConfigurations += ['en', 'si', 'ta']
        vectorDrawables {
            useSupportLibrary = true
        }
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }
    signingConfigs {
        release {
            storeFile file('C:\\Users\\Lenovo\\IdeaProjects\\SMI4.2.5\\myCert\\SSSCert.jks')
            storePassword '773661227'
            keyAlias = 'sssKey'
            keyPassword '50864636'
        }
        debug {
            storeFile file('C:\\Users\\Lenovo\\IdeaProjects\\SMI4.2.5\\myCert\\SSSCert.jks')
            storePassword '773661227'
            keyAlias = 'sssKey'
            keyPassword '50864636'
        }
    }
    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
    bundle {
        language {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        buildConfig true
    }
}
dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation platform('com.google.firebase:firebase-bom:30.2.0')

    implementation 'com.firebaseui:firebase-ui-auth:8.0.1'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.google.firebase:firebase-ads:21.5.0'

    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.webkit:webkit:1.15.0'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.navigation:navigation-fragment:2.9.6'
    implementation 'androidx.navigation:navigation-ui:2.9.6'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation "androidx.room:room-runtime:2.8.4"
    annotationProcessor "androidx.room:room-compiler:2.8.4"
    implementation project(':MPChartLib')
}