plugins {
    id 'com.android.application'
    id 'androidx.navigation.safeargs'
    id 'com.google.gms.google-services'
}

android {
    namespace 'sss.yml.smi'
    defaultConfig {
        compileSdk 37
        applicationId "sss.yml.smi"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 4257 //web-to-app intent link, 2026-11-10
        versionName "4.2.5.7"
        resConfigs 'en', 'si', 'ta'
        vectorDrawables {
            useSupportLibrary = true
        }
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }
    signingConfigs {
        release {
            storeFile file('.\\SSSCert.jks')
            storePassword '773661227'
            keyAlias = 'sssKey'
            keyPassword '50864636'
        }
        debug {
            storeFile file('.\\SSSCert.jks')
            storePassword '773661227'
            keyAlias = 'sssKey'
            keyPassword '50864636'
        }
    }
    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            //shrinkResources true
            //minifyEnabled true
            signingConfig signingConfigs.debug
        }
    }
    bundle {
        language {
            enableSplit = true
        }
        density {
            enableSplit = true
        }
        abi {
            enableSplit = true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
    compileSdk 37
}
dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.1.0')

    implementation 'com.firebaseui:firebase-ui-auth:9.1.1'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'

    implementation 'androidx.webkit:webkit:1.17.1'
    implementation 'androidx.annotation:annotation:1.11.0'
    implementation 'androidx.navigation:navigation-fragment:2.10.2'
    implementation 'androidx.navigation:navigation-ui:2.10.2'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation "androidx.room:room-runtime:2.8.5"
    annotationProcessor "androidx.room:room-compiler:2.8.5"
    implementation project(':MPChartLib')
}