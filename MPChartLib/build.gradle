plugins {
    id 'com.android.library'
}

android {
    namespace 'com.github.mikephil.charting'
    compileSdk 36

    defaultConfig {
        minSdk 23
        targetSdk 36
    }

    buildTypes {
        release {
            minifyEnabled true
        }
    }

    lint {
        abortOnError false
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

